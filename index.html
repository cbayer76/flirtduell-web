<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FlirtDuell · Demo-Zugang</title><style id="gate-style">*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#faf7fc;color:#272137}#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}form{width:100%;max-width:400px;background:white;padding:34px;border:1px solid #eadce8;border-radius:24px;box-shadow:0 18px 65px #4e193010}h1{font-size:32px;margin:0 0 12px}h1 span{color:#b92167}p{line-height:1.5;color:#85728e}label{display:grid;gap:8px;font-size:14px}input,button{width:100%;padding:14px;border-radius:10px;font:inherit}input{border:1px solid #dbc9d8;margin:8px 0 16px}button{border:0;background:#b92167;color:white;cursor:pointer}button:disabled{opacity:.6}#error{color:#ae2545;font-size:14px}</style></head><body><div id="gate"><form id="unlock"><h1>flirtduell<span>.</span></h1><p>Diese Demo ist passwortgeschützt.</p><label>Passwort<input id="password" type="password" autocomplete="current-password" required autofocus></label><button id="submit">Demo öffnen</button><p id="error" role="status"></p></form></div><div id="root"></div><script type="module">
const fromHex=s=>Uint8Array.from(s.match(/../g),h=>parseInt(h,16));const salt=fromHex('e07f1e0ce4ec0d280742faa7022a1953'),iv=fromHex('487a22ab51dc2d8c2c180bff');
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),input=document.getElementById('password'),status=document.getElementById('error');button.disabled=true;status.textContent='Demo wird geöffnet …';let app;try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const response=await fetch('./demo.enc?v=e07f1e0ce4ec0d280742faa7022a1953',{cache:'no-store'});if(!response.ok)throw Error('download');const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,await response.arrayBuffer());app=JSON.parse(new TextDecoder().decode(plaintext));}catch{status.textContent='Passwort falsch oder Demo nicht erreichbar. Bitte erneut versuchen.';button.disabled=false;input.focus();return;}input.value='';try{for(const [src,data] of Object.entries(app.images)){app.js=app.js.split(src).join(data);app.css=app.css.split(src).join(data);}const style=document.createElement('style');style.textContent=app.css;document.head.appendChild(style);const url=URL.createObjectURL(new Blob([app.js],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url);document.getElementById('gate').remove();document.getElementById('gate-style').remove();}catch{status.textContent='Die Demo konnte nicht geladen werden. Bitte neu laden.';button.disabled=false;}});
</script></body></html>
